<div id="modulo-apertura-caja" class="max-w-7xl mx-auto space-y-6 opacity-0 translate-y-2 transition-all duration-300 p-4">

    {% include "cajas/submenu.html" %}

    <div class="max-w-xl mx-auto">
        <div id="card-abrir-caja" class="bg-gray-950 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-5 hidden">
            <div class="border-b border-gray-800 pb-4">
                <span class="bg-amber-500/10 text-amber-400 text-[10px] font-black px-2.5 py-1 rounded-full uppercase border border-amber-500/20">Turno Inactivo</span>
                <h3 class="text-lg font-bold text-gray-100 mt-2">Abrir Turno de Caja</h3>
                <p class="text-xs text-gray-400">Ingresá el saldo inicial en efectivo disponible para comenzar a operar.</p>
            </div>

            <form onsubmit="procesarAperturaCaja(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Monto Inicial en Efectivo ($)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-sm font-bold text-gray-500">$</span>
                        <input type="number" step="0.01" min="0" id="input-monto-inicial" required placeholder="0.00" 
                            class="w-full bg-gray-900 border border-gray-800 rounded-xl pl-8 pr-4 py-3 text-sm text-gray-100 font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-emerald-950/40 cursor-pointer">
                    🚀 Confirmar y Abrir Turno
                </button>
            </form>
        </div>

        <div id="card-caja-abierta" class="bg-gray-950 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-5 hidden">
            <div class="border-b border-gray-800 pb-4 flex justify-between items-center">
                <div>
                    <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-black px-2.5 py-1 rounded-full uppercase border border-emerald-500/20">Turno Activo</span>
                    <h3 class="text-lg font-bold text-gray-100 mt-2">Caja Abierta</h3>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-gray-500 uppercase block">N° Turno</span>
                    <span id="label-caja-id" class="text-base font-mono font-bold text-emerald-400">#---</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 bg-gray-900/50 p-4 rounded-xl border border-gray-850">
                <div>
                    <span class="text-[10px] text-gray-400 uppercase block">Monto Inicial</span>
                    <span id="label-monto-inicial" class="text-base font-bold text-gray-200 font-mono">$0.00</span>
                </div>
                <div>
                    <span class="text-[10px] text-gray-400 uppercase block">Apertura</span>
                    <span id="label-fecha-apertura" class="text-xs text-gray-300 font-mono">--/--/-- --:--</span>
                </div>
            </div>

            <form onsubmit="procesarCierreCaja(event)" class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Monto Real en Efectivo al Cerrar ($)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-sm font-bold text-gray-500">$</span>
                        <input type="number" step="0.01" min="0" id="input-monto-final-real" required placeholder="0.00" 
                            class="w-full bg-gray-900 border border-gray-800 rounded-xl pl-8 pr-4 py-3 text-sm text-gray-100 font-mono focus:outline-none focus:border-rose-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-rose-500/90 hover:bg-rose-500 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-rose-950/40 cursor-pointer">
                    🔒 Cerrar Turno de Caja
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    (function() {
        const mod = document.getElementById('modulo-apertura-caja');
        if(mod) {
            setTimeout(() => {
                mod.classList.remove('opacity-0', 'translate-y-2');
            }, 50);
        }
    })();

    async function consultarEstadoCaja() {
        try {
            const res = await fetch('/cajas/activa');
            const cardAbrir = document.getElementById('card-abrir-caja');
            const cardAbierta = document.getElementById('card-caja-abierta');

            if (res.ok) {
                const caja = await res.json();
                cardAbrir.classList.add('hidden');
                cardAbierta.classList.remove('hidden');

                document.getElementById('label-caja-id').innerText = `#${caja.id}`;
                document.getElementById('label-monto-inicial').innerText = `$${parseFloat(caja.monto_inicial).toFixed(2)}`;
                
                if (caja.fecha_apertura) {
                    const fecha = new Date(caja.fecha_apertura);
                    document.getElementById('label-fecha-apertura').innerText = fecha.toLocaleDateString('es-AR') + ' ' + fecha.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});
                }
            } else {
                cardAbierta.classList.add('hidden');
                cardAbrir.classList.remove('hidden');
            }
        } catch (e) {
            console.error("Error consultando caja activa:", e);
        }
    }

    async function procesarAperturaCaja(e) {
        e.preventDefault();
        const monto = parseFloat(document.getElementById('input-monto-inicial').value) || 0;

        try {
            const res = await fetch('/cajas/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monto_inicial: monto })
            });

            if (res.ok) {
                mostrarNotificacion("Turno de caja abierto correctamente.", "exito");
                document.getElementById('input-monto-inicial').value = '';
                consultarEstadoCaja();
            } else {
                const err = await res.json();
                mostrarNotificacion(err.detail || "Error al abrir la caja.", "error");
            }
        } catch (e) {
            mostrarNotificacion("Error de conexión al abrir la caja.", "error");
        }
    }

    async function procesarCierreCaja(e) {
        e.preventDefault();
        const montoReal = parseFloat(document.getElementById('input-monto-final-real').value) || 0;

        try {
            const res = await fetch('/cajas/cerrar', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monto_final_real: montoReal })
            });

            if (res.ok) {
                mostrarNotificacion("Turno de caja cerrado exitosamente.", "exito");
                document.getElementById('input-monto-final-real').value = '';
                consultarEstadoCaja();
            } else {
                const err = await res.json();
                mostrarNotificacion(err.detail || "Error al cerrar la caja.", "error");
            }
        } catch (e) {
            mostrarNotificacion("Error de conexión al cerrar la caja.", "error");
        }
    }

    // Consulta inicial al renderizar la vista
    consultarEstadoCaja();
</script>

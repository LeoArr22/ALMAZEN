<div class="max-w-7xl mx-auto flex items-center justify-between gap-4 mb-6 border-b border-gray-800 pb-4 select-none">
    <div>
        <h2 id="titulo-modulo-cajas" class="text-base font-black tracking-wide uppercase flex items-center gap-2 text-gray-100">
            </h2>
        <p id="leyenda-modulo-cajas" class="text-xs text-gray-400 mt-0.5">
            </p>
    </div>
    
    <div class="flex items-center gap-1.5 bg-gray-900/50 border border-gray-800 p-1.5 rounded-xl flex-shrink-0">
        <button id="btn-caja-apertura" onclick="irASeccion('cajas_apertura')" class="text-xs font-bold px-3.5 py-2 rounded-lg transition-all text-gray-400 hover:text-gray-200 hover:bg-gray-800/40 cursor-pointer flex items-center gap-1">
            🔑 Apertura y Cierre
        </button>
        <button id="btn-caja-control" onclick="irASeccion('cajas')" class="text-xs font-bold px-3.5 py-2 rounded-lg transition-all text-gray-400 hover:text-gray-200 hover:bg-gray-800/40 cursor-pointer flex items-center gap-1">
            📊 Control y Auditoría
        </button>
    </div>
</div>

<script>
    (function() {
        setTimeout(() => {
            const titulo = document.getElementById('titulo-modulo-cajas');
            const leyenda = document.getElementById('leyenda-modulo-cajas');

            const esVistaApertura = document.getElementById('modulo-apertura-caja');
            const esVistaControl = document.getElementById('modulo-gestion-cajas');

            if (esVistaApertura) {
                if(titulo) titulo.innerHTML = "🔑 Mi Turno de Caja";
                if(leyenda) leyenda.innerHTML = "Gestión individual de apertura, control de saldo inicial y cierre con arqueo.";
                marcarBotonActivoCajas('btn-caja-apertura');
            } 
            else if (esVistaControl) {
                if(titulo) titulo.innerHTML = "📊 Control y Auditoría de Cajas";
                if(leyenda) leyenda.innerHTML = "Supervisión global de aperturas, arqueos y cierres de los vendedores.";
                marcarBotonActivoCajas('btn-caja-control');
            }
        }, 1);

        function marcarBotonActivoCajas(idBoton) {
            const btn = document.getElementById(idBoton);
            if (btn) {
                btn.className = "text-xs font-extrabold px-3.5 py-2 rounded-lg transition-all text-gray-950 bg-gradient-to-r from-emerald-400 to-teal-400 shadow-md shadow-emerald-950/20 cursor-default flex items-center gap-1";
            }
        }
    })();
</script>

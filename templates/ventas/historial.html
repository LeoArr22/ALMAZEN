{% include "ventas/submenu.html" %}

<div id="modulo-historial-ventas" class="max-w-7xl mx-auto space-y-4 opacity-0 translate-y-2 transition-all duration-300">
    
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono text-xs select-none">
        <div class="space-y-1.5">
            <label class="text-gray-500 font-bold uppercase block tracking-wider">📦 Filtrar por Caja (ID)</label>
            <input type="number" id="filtro-caja" placeholder="Ej: 1" min="1"
                class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none focus:border-emerald-500 transition-all placeholder:text-gray-700">
        </div>
        
        <div class="space-y-1.5">
            <label class="text-gray-500 font-bold uppercase block tracking-wider">📅 Filtrar por Fecha</label>
            <input type="date" id="filtro-fecha" 
                class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none focus:border-emerald-500 transition-all text-gray-400 focus:text-gray-200">
        </div>

        <div class="space-y-1.5">
            <label class="text-gray-500 font-bold uppercase block tracking-wider">🕒 Filtrar por Hora (HH:MM)</label>
            <input type="time" id="filtro-hora" 
                class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none focus:border-emerald-500 transition-all text-gray-400 focus:text-gray-200">
        </div>
    </div>
    
    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b border-gray-800 bg-gray-950/40 text-gray-400 font-mono text-xs uppercase tracking-wider">
                        <th class="p-4 font-bold">Comprobante N°</th>
                        <th class="p-4 font-bold">Fecha y Hora</th>
                        <th class="p-4 font-bold text-center">Caja ID</th>
                        <th class="p-4 font-bold text-right">Monto Total</th>
                        <th class="p-4 font-bold text-center w-28">Detalles</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial-cuerpo" class="divide-y divide-gray-800/40 text-gray-300 font-mono">
                    <tr>
                        <td colspan="5" class="text-center py-20 text-gray-600 tracking-tight font-sans text-xs">
                            ⏳ Consultando registro histórico de cajas...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="drawer-detalle-venta" class="fixed inset-0 z-50 invisible transition-all duration-300 select-none">
    <div onclick="cerrarDrawerDetalle()" class="absolute inset-0 bg-gray-950/70 backdrop-blur-sm transition-opacity duration-300 opacity-0" id="drawer-backdrop"></div>
    
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-gray-900 border-l border-gray-800 p-6 flex flex-col justify-between shadow-2xl transform translate-x-full transition-transform duration-300" id="drawer-panel">
        <div class="space-y-6 overflow-y-auto pr-1">
            <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                <div>
                    <h3 class="text-xs font-mono font-bold uppercase text-gray-500 tracking-wider">Detalle del Comprobante</h3>
                    <span id="drawer-id-venta" class="text-lg font-black text-emerald-400 font-mono">#0000</span>
                </div>
                <button onclick="cerrarDrawerDetalle()" class="w-8 h-8 rounded-xl bg-gray-950 hover:bg-gray-800 border border-gray-800 text-gray-400 hover:text-gray-200 flex items-center justify-center text-xs transition-colors cursor-pointer">✕</button>
            </div>

            <div class="bg-gray-950/40 border border-gray-800/60 rounded-xl p-4 font-mono text-xs space-y-2 text-gray-400">
                <div class="flex justify-between"><span class="font-sans">Emisión:</span><span id="drawer-fecha-venta" class="text-gray-200 font-bold">-</span></div>
                <div class="flex justify-between"><span class="font-sans">N° de Caja operativa:</span><span id="drawer-caja-venta" class="text-gray-200 font-bold">-</span></div>
            </div>

            <div class="space-y-3">
                <h4 class="text-[10px] font-mono font-bold uppercase text-gray-500 tracking-widest">Artículos liquidados</h4>
                <div id="drawer-lista-articulos" class="divide-y divide-gray-800/50 max-h-[320px] overflow-y-auto">
                    </div>
            </div>
        </div>

        <div class="border-t border-gray-800 pt-4 bg-gray-950 -mx-6 -mb-6 p-6 rounded-b-2xl border-l border-l-gray-800 space-y-4">
            <div class="flex justify-between items-center font-mono">
                <span class="text-xs font-bold text-gray-400 uppercase">Monto Neto Cobrado:</span>
                <span id="drawer-total-venta" class="text-2xl font-black text-emerald-400">$ 0.00</span>
            </div>

            <!-- Contenedor del Botón / Estado de Anulación -->
            <div id="drawer-contenedor-acciones" class="pt-2">
                <button id="btn-anular-venta" onclick="confirmarAnulacionVenta()" 
                    class="w-full py-2.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 text-rose-300 font-mono text-xs font-bold rounded-xl transition-all cursor-pointer flex items-center justify-center gap-2">
                    🚫 Anular Venta y Reponer Stock
                </button>
                <div id="banner-venta-anulada" class="hidden w-full py-2 bg-rose-950/30 border border-rose-900/50 text-rose-400 font-mono text-xs text-center font-bold rounded-xl">
                    ⚠️ VENTA ANULADA (Stock Reintegrado)
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const moduloContenedor = document.getElementById('modulo-historial-ventas');
        const tablaCuerpo = document.getElementById('tabla-historial-cuerpo');
        
        // Inputs de Filtros
        const inputFiltroCaja = document.getElementById('filtro-caja');
        const inputFiltroFecha = document.getElementById('filtro-fecha');
        const inputFiltroHora = document.getElementById('filtro-hora'); // Este se sigue refinando en JS

        // Elementos del Drawer
        const drawer = document.getElementById('drawer-detalle-venta');
        const drawerBackdrop = document.getElementById('drawer-backdrop');
        const drawerPanel = document.getElementById('drawer-panel');

        setTimeout(() => {
            moduloContenedor.classList.remove('opacity-0', 'translate-y-2');
        }, 50);

        // 🟢 Función unificada para consultar a la API con filtros reales en BD
        async function cargarHistorialServidor() {
            try {
                const valCaja = inputFiltroCaja.value.trim();
                const valFecha = inputFiltroFecha.value; // Formato YYYY-MM-DD

                // Armamos los Query Params dinámicamente para FastAPI
                let url = new URL(window.location.origin + '/ventas/');
                url.searchParams.append('limit', '50'); // Traemos un lote cómodo de 50 por consulta
                
                if (valCaja !== "") url.searchParams.append('caja_id', valCaja);
                if (valFecha !== "") url.searchParams.append('fecha', valFecha);

                tablaCuerpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-20 text-gray-600 tracking-tight font-sans text-xs">
                            ⏳ Buscando en el registro histórico de la base de datos...
                        </td>
                    </tr>`;

                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error("Fallo de lectura");
                
                let ventas = await respuesta.json();

                // 🕒 Filtro de Hora secundario (se aplica en JS sobre el resultado de esa fecha/caja)
                const valHora = inputFiltroHora.value;
                if (valHora !== "" && ventas.length > 0) {
                    ventas = ventas.filter(v => {
                        const f = new Date(v.fecha_venta);
                        const [horaF, minF] = valHora.split(':');
                        const horaV = String(f.getHours()).padStart(2, '0');
                        const minV = String(f.getMinutes()).padStart(2, '0');
                        return horaF === horaV && minF === minV;
                    });
                }

                renderizarTablaHistorial(ventas);
            } catch (err) {
                tablaCuerpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-16 text-rose-400 font-sans text-xs">
                            ⚠️ Error al conectar con el servidor de auditoría.
                        </td>
                    </tr>`;
            }
        }

        // Escuchadores de eventos: Ahora rearman la query de SQL en cada cambio
        inputFiltroCaja.addEventListener('input', cargarHistorialServidor);
        inputFiltroFecha.addEventListener('change', cargarHistorialServidor);
        inputFiltroHora.addEventListener('input', cargarHistorialServidor); // Refina la hora al toque

        function renderizarTablaHistorial(ventas) {
            if (ventas.length === 0) {
                tablaCuerpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-20 text-gray-600 font-sans text-xs">
                            🔍 Ninguna venta coincide con los criterios de filtro aplicados.
                        </td>
                    </tr>`;
                return;
            }

            tablaCuerpo.innerHTML = ventas.map(v => {
                const f = new Date(v.fecha_venta);
                const fechaFormateada = f.toLocaleDateString() + ' - ' + f.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                return `
                    <tr class="hover:bg-gray-900/40 transition-colors">
                        <td class="p-4 text-gray-400 font-bold"># ${String(v.id).padStart(4, '0')}</td>
                        <td class="p-4 text-gray-300">${fechaFormateada}</td>
                        <td class="p-4 text-center text-gray-500 font-sans"><span class="bg-gray-950 px-2 py-1 border border-gray-800 rounded-md text-xs font-mono font-bold text-gray-400">${v.caja_id}</span></td>
                        <td class="p-4 text-right font-black text-emerald-400 text-sm">$ ${parseFloat(v.total).toFixed(2)}</td>
                        <td class="p-4 text-center">
                            <button onclick="abrirDetalleVenta(${v.id})" class="text-xs font-bold px-2.5 py-1.5 bg-gray-950 border border-gray-800 text-gray-300 hover:text-emerald-400 hover:border-emerald-500/30 rounded-lg transition-all cursor-pointer">
                                🔍 Ver
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
let ventaSeleccionadaId = null;

        // 👁️ Ver renglones detallados
        window.abrirDetalleVenta = async function(id) {
            try {
                ventaSeleccionadaId = id; // Guardamos el ID actual
                const respuesta = await fetch(`/ventas/${id}`);
                if (!respuesta.ok) return;
                
                const v = await respuesta.json();

                document.getElementById('drawer-id-venta').innerText = `# ${String(v.id).padStart(4, '0')}`;
                const f = new Date(v.fecha_venta);
                document.getElementById('drawer-fecha-venta').innerText = f.toLocaleDateString() + ' ' + f.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('drawer-caja-venta').innerText = v.caja_id;
                document.getElementById('drawer-total-venta').innerText = `$ ${parseFloat(v.total).toFixed(2)}`;

                // Controlar Visibilidad según si está anulada o no
                const btnAnular = document.getElementById('btn-anular-venta');
                const bannerAnulada = document.getElementById('banner-venta-anulada');

                if (v.es_anulada) {
                    btnAnular.classList.add('hidden');
                    bannerAnulada.classList.remove('hidden');
                    document.getElementById('drawer-total-venta').classList.replace('text-emerald-400', 'text-gray-500');
                    document.getElementById('drawer-total-venta').classList.add('line-through');
                } else {
                    btnAnular.classList.remove('hidden');
                    bannerAnulada.classList.add('hidden');
                    document.getElementById('drawer-total-venta').classList.replace('text-gray-500', 'text-emerald-400');
                    document.getElementById('drawer-total-venta').classList.remove('line-through');
                }

                const listaArticulos = document.getElementById('drawer-lista-articulos');
                
                if (v.detalles && v.detalles.length > 0) {
                    listaArticulos.innerHTML = `<div class="text-center text-gray-600 py-6 text-xs font-sans">⏳ Recuperando nombres del catálogo...</div>`;
                    
                    const promesasDetalles = v.detalles.map(async (d) => {
                        let nombreProducto = `Producto ID: ${d.producto_id}`;
                        try {
                            const resProd = await fetch(`/productos/${d.producto_id}`);
                            if (resProd.ok) {
                                const prodData = await resProd.json();
                                if (prodData && prodData.nombre) nombreProducto = prodData.nombre;
                            }
                        } catch (pErr) {
                            console.error(pErr);
                        }

                        return `
                            <div class="py-3 flex justify-between items-center font-mono text-xs">
                                <div class="pr-2">
                                    <span class="font-black text-gray-100 block text-sm tracking-tight">${nombreProducto}</span>
                                    <span class="text-gray-500 font-sans text-[11px]">Código Ref: # ${d.producto_id} — Unitario: $ ${parseFloat(d.precio_historico).toFixed(2)}</span>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <span class="text-gray-400 block font-bold">x${d.cantidad}</span>
                                    <span class="text-emerald-400 font-black text-sm">$ ${(parseFloat(d.precio_historico) * d.cantidad).toFixed(2)}</span>
                                </div>
                            </div>
                        `;
                    });

                    const htmlRenglones = await Promise.all(promesasDetalles);
                    listaArticulos.innerHTML = htmlRenglones.join('');

                } else {
                    listaArticulos.innerHTML = `<div class="text-center text-gray-600 py-6 text-xs">Comprobante sin artículos asociados</div>`;
                }

                drawer.classList.remove('invisible');
                setTimeout(() => {
                    drawerBackdrop.classList.remove('opacity-0');
                    drawerPanel.classList.remove('translate-x-full');
                }, 10);

            } catch (err) {
                if (typeof emitirNotificacionGlobal === 'function') {
                    emitirNotificacionGlobal("⚠️ Error al recabar los datos de la venta", "error");
                }
            }
        };

        // 🚫 Ejecutar Anulación
        window.confirmarAnulacionVenta = async function() {
            if (!ventaSeleccionadaId) return;

            const confirmar = confirm(`¿Estás seguro de que deseas anular la Venta #${ventaSeleccionadaId}? El stock de los productos será reintegrado automáticamente.`);
            if (!confirmar) return;

            try {
                const res = await fetch(`/ventas/${ventaSeleccionadaId}/anular`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    if (typeof emitirNotificacionGlobal === 'function') {
                        emitirNotificacionGlobal("✅ Venta anulada y stock devuelto exitosamente", "exito");
                    }
                    cerrarDrawerDetalle();
                    cargarHistorialServidor(); // Recargar la lista para reflejar los cambios
                } else {
                    const errData = await res.json();
                    alert(`Error: ${errData.detail || "No se pudo anular la venta"}`);
                }
            } catch (err) {
                alert("Ocurrió un error de conexión al intentar anular.");
            }
        };
        
        window.cerrarDrawerDetalle = function() {
            drawerBackdrop.classList.add('opacity-0');
            drawerPanel.classList.add('translate-x-full');
            setTimeout(() => {
                drawer.classList.add('invisible');
            }, 300);
        };

        cargarHistorialServidor();

    })();
</script>

{% include "productos/submenu.html" %}

<div id="panel-buscar-productos" class="max-w-7xl mx-auto space-y-4">
    
    <div class="flex items-center gap-3">
        <input type="text" id="input-busqueda-productos" placeholder="Buscar por código o nombre..." class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-2 text-xs w-full max-w-md focus:outline-none focus:border-emerald-500 text-gray-200">
    </div>

    <div class="overflow-x-auto bg-gray-900 border border-gray-800 rounded-2xl">
        </div>
</div>
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl mb-4 flex-shrink-0">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-wider mb-1">Nombre / Artículo</label>
                <input type="text" id="filtro-nombre" autocomplete="off"
                       class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-100 placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition-all"
                       placeholder="Escribí para buscar...">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-wider mb-1">Categoría</label>
                <select id="filtro-categoria"
                        class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300 focus:outline-none focus:border-emerald-500 transition-all cursor-pointer">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-wider mb-1">Ordenar por</label>
                <select id="filtro-orden"
                        class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300 focus:outline-none focus:border-emerald-500 transition-all cursor-pointer">
                    <option value="nombre_asc">Nombre (A - Z)</option>
                    <option value="precio_asc">Precio: Menor a Mayor</option>
                    <option value="precio_desc">Precio: Mayor a Menor</option>
                    <option value="stock_asc">Stock: Menor a Mayor</option>
                    <option value="stock_desc">Stock: Mayor a Menor</option>
                </select>
            </div>
            <div class="flex items-end">
                <button id="btn-limpiar-filtros"
                        class="w-full bg-gray-950 border border-gray-800 hover:border-gray-700 text-gray-300 hover:text-gray-100 font-bold text-xs py-2 rounded-xl transition-all cursor-pointer flex items-center justify-center gap-1">
                    🧹 Limpiar Filtros
                </button>
            </div>
        </div>
    </div>

    <div class="flex-grow bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col min-h-0 shadow-2xl">
        <div class="flex-grow overflow-auto custom-scrollbar min-h-0">
            <table class="w-full text-left border-collapse relative">
                <thead class="sticky top-0 bg-gray-950 z-10 border-b border-gray-800 shadow-sm select-none">
                    <tr class="text-[10px] font-black text-gray-400 uppercase tracking-wider">
                        <th class="px-4 py-3 w-16 text-center">ID</th>
                        <th class="px-4 py-3 w-44">Código de Barras</th>
                        <th class="px-4 py-3 w-64">Nombre / Artículo</th>
                        <th class="px-4 py-3 w-48">Categoría</th>
                        <th class="px-4 py-3 w-60">Descripción / Detalle</th>
                        <th class="px-4 py-3 w-28 text-right">Stock</th>
                        <th class="px-4 py-3 w-32 text-right">Costo ($)</th>
                        <th class="px-4 py-3 w-32 text-right">Venta ($)</th>
                        <th class="px-4 py-3 w-32 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos-body" class="divide-y divide-gray-800/60 text-xs text-gray-300">
                    </tbody>
            </table>
            
            <div id="tabla-vacia-estado" class="hidden text-center py-16 text-gray-500 font-mono text-xs">
                ⚠️ No se encontraron productos que coincidan con la búsqueda.
            </div>
        </div>

        <div class="bg-gray-950 border-t border-gray-800 px-5 py-3 flex items-center justify-between flex-shrink-0 select-none">
            <div class="text-[11px] text-gray-500 font-mono">
                Mostrando <span id="pag-info-desde" class="text-gray-300 font-bold">0</span> al <span id="pag-info-hasta" class="text-gray-300 font-bold">0</span> de un total de <span id="pag-info-total" class="text-gray-300 font-bold">0</span>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="btn-pag-anterior" class="bg-gray-900 border border-gray-800 hover:border-gray-700 disabled:opacity-30 disabled:cursor-not-allowed text-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer">
                    ◀ Anterior
                </button>
                <div id="pag-numeros-contenedor" class="flex items-center gap-1 text-xs font-mono">
                    </div>
                <button id="btn-pag-siguiente" class="bg-gray-900 border border-gray-800 hover:border-gray-700 disabled:opacity-30 disabled:cursor-not-allowed text-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer">
                    Siguiente ▶
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .custom-scrollbar::-webkit-scrollbar { width: 7px; height: 7px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #030712; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #10b981; }
</style>

<script>
    (() => {
        // Estado local de la interfaz de Búsqueda y Edición
        let productosLocales = [];
        let categoriasLocales = [];
        let paginaActual = 1;
        const limitePorPagina = 15; // Cantidad considerable de registros por página

        // Elementos del DOM
        const tablaBody = document.getElementById('tabla-productos-body');
        const tablaVacia = document.getElementById('tabla-vacia-estado');
        const filtroNombre = document.getElementById('filtro-nombre');
        const filtroCategoria = document.getElementById('filtro-categoria');
        const filtroOrden = document.getElementById('filtro-orden');
        const btnLimpiar = document.getElementById('btn-limpiar-filtros');
        
        const btnAnt = document.getElementById('btn-pag-anterior');
        const btnSig = document.getElementById('btn-pag-siguiente');
        const contenedorNumeros = document.getElementById('pag-numeros-contenedor');
        const infoDesde = document.getElementById('pag-info-desde');
        const infoHasta = document.getElementById('pag-info-hasta');
        const infoTotal = document.getElementById('pag-info-total');

        // Función de limpieza nativa cuando el Dashboard remueve el componente
        window.moduloActivoLimpieza = () => {
            productosLocales = [];
            window.moduloActivoLimpieza = null;
        };

        // Función de normalización idéntica a la del alta rápida
        function normalizarCategoria(texto) {
            if (!texto) return "";
            const mapaTildes = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U' };
            const sinTildes = texto.split('').map(letra => mapaTildes[letra] || letra).join('');
            const limpia = sinTildes.trim();
            return limpia.charAt(0).toUpperCase() + limpia.slice(1).toLowerCase();
        }

        // 🛠️ INICIALIZACIÓN: Traer datos del servidor de FastAPI
        async function inicializarModulo() {
            tablaBody.innerHTML = '<tr><td colspan="9" class="text-center py-10 text-gray-500 font-mono">⏳ Cargando catálogo de productos...</td></tr>';
            try {
                // 1. Traer todos los productos (aprovechando tu endpoint /productos/)
                const resProd = await fetch('/productos/?skip=0&limit=500');
                if (!resProd.ok) throw new Error(`Catálogo no disponible (Código ${resProd.status})`);
                productosLocales = await resProd.json();

                // 2. Extraer dinámicamente las categorías únicas para el selector de filtros
                categoriasLocales = [...new Set(productosLocales.map(p => p.categoria))].filter(Boolean).sort();
                
                // Rellenar select de categorías
                filtroCategoria.innerHTML = '<option value="">Todas las categorías</option>';
                categoriasLocales.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    filtroCategoria.appendChild(opt);
                });

                procesarYRenderizar();
            } catch (error) {
                tablaBody.innerHTML = '';
                emitirNotificacionGlobal(`❌ Error al cargar datos: ${error.message}`, "error");
            }
        }

        // ⚙️ PROCESAMIENTO: Filtrado, ordenamiento y paginación en el cliente para máxima velocidad
        function procesarYRenderizar() {
            let resultado = [...productosLocales];

            // Aplicar Filtro de Nombre
            const busqueda = filtroNombre.value.toLowerCase().trim();
            if (busqueda !== "") {
                resultado = resultado.filter(p => 
                    p.nombre.toLowerCase().includes(busqueda) || 
                    (p.codigo_barras && p.codigo_barras.includes(busqueda))
                );
            }

            // Aplicar Filtro de Categoría
            const catSeleccionada = filtroCategoria.value;
            if (catSeleccionada !== "") {
                resultado = resultado.filter(p => p.categoria === catSeleccionada);
            }

            // Aplicar Ordenamiento
            const orden = filtroOrden.value;
            if (orden === "nombre_asc") {
                resultado.sort((a, b) => a.nombre.localeCompare(b.nombre));
            } else if (orden === "precio_asc") {
                resultado.sort((a, b) => parseFloat(a.precio) - parseFloat(b.precio));
            } else if (orden === "precio_desc") {
                resultado.sort((a, b) => parseFloat(b.precio) - parseFloat(a.precio));
            } else if (orden === "stock_asc") {
                resultado.sort((a, b) => a.stock - b.stock);
            } else if (orden === "stock_desc") {
                resultado.sort((a, b) => b.stock - a.stock);
            }

            // Configurar Paginación
            const totalRegistros = resultado.length;
            const totalPaginas = Math.ceil(totalRegistros / limitePorPagina) || 1;
            
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;

            const indiceDesde = (paginaActual - 1) * limitePorPagina;
            const indiceHasta = Math.min(indiceDesde + limitePorPagina, totalRegistros);
            
            const productosPaginados = resultado.slice(indiceDesde, indiceHasta);

            // Actualizar datos del Pie de página
            infoDesde.innerText = totalRegistros === 0 ? 0 : indiceDesde + 1;
            infoHasta.innerText = indiceHasta;
            infoTotal.innerText = totalRegistros;

            btnAnt.disabled = paginaActual === 1;
            btnSig.disabled = paginaActual === totalPaginas;

            // Renderizar números de páginas fluidos
            contenedorNumeros.innerHTML = "";
            for (let i = 1; i <= totalPaginas; i++) {
                if (i === 1 || i === totalPaginas || Math.abs(i - paginaActual) <= 1) {
                    const btnPag = document.createElement('button');
                    btnPag.innerText = i;
                    btnPag.className = `px-2 py-1 rounded-md font-bold transition-all cursor-pointer ${
                        i === paginaActual 
                        ? 'bg-emerald-500/20 border border-emerald-500/50 text-emerald-400' 
                        : 'bg-gray-900 border border-gray-800 text-gray-500 hover:text-gray-300'
                    }`;
                    btnPag.addEventListener('click', () => { paginaActual = i; procesarYRenderizar(); });
                    contenedorNumeros.appendChild(btnPag);
                } else if (i === 2 || i === totalPaginas - 1) {
                    const elipsis = document.createElement('span');
                    elipsis.innerText = "...";
                    elipsis.className = "text-gray-700 px-0.5";
                    contenedorNumeros.appendChild(elipsis);
                }
            }

            renderizarTablaHTML(productosPaginados);
        }

        // 🖥️ RENDERIZADO: Estructurar el HTML puro de las filas de productos
        function renderizarTablaHTML(productos) {
            tablaBody.innerHTML = "";
            
            if (productos.length === 0) {
                tablaVacia.classList.remove('hidden');
                return;
            }
            tablaVacia.classList.add('hidden');

            productos.forEach(p => {
                const tr = document.createElement('tr');
                tr.id = `fila-prod-${p.id}`;
                tr.className = "hover:bg-gray-900/40 transition-colors group align-middle";

                // Procesamiento limpio de la descripción para tooltip nativo
                const descCompleta = p.descripcion || "";
                const descCorta = descCompleta.length > 30 ? descCompleta.slice(0, 28) + "..." : descCompleta;

                tr.innerHTML = `
                    <td class="px-4 py-2.5 text-center font-mono text-gray-600 font-bold">${p.id}</td>
                    
                    <td class="px-4 py-2.5">
                        <input type="text" id="edit-codigo-${p.id}" value="${p.codigo_barras || ''}" oninput="activarEdicionFila(${p.id})"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all font-mono text-gray-100 placeholder-gray-800 text-xs" placeholder="Ninguno">
                    </td>
                    
                    <td class="px-4 py-2.5">
                        <input type="text" id="edit-nombre-${p.id}" value="${p.nombre}" oninput="activarEdicionFila(${p.id})"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all font-semibold text-gray-200 text-xs">
                    </td>
                    
                    <td class="px-4 py-2.5">
                        <input type="text" id="edit-categoria-${p.id}" value="${p.categoria}" oninput="activarEdicionFila(${p.id})"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all text-gray-300 text-xs">
                    </td>
                    
                    <td class="px-4 py-2.5 max-w-xs relative">
                        <input type="text" id="edit-descripcion-${p.id}" value="${descCompleta}" oninput="activarEdicionFila(${p.id})" title="${descCompleta}"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all text-gray-400 text-xs truncate" placeholder="Sin detalle">
                    </td>
                    
                    <td class="px-4 py-2.5">
                        <input type="number" id="edit-stock-${p.id}" value="${p.stock}" min="0" oninput="activarEdicionFila(${p.id})"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all text-right font-mono text-emerald-400 text-xs">
                    </td>
                    
                    <td class="px-4 py-2.5">
                        <input type="number" id="edit-costo-${p.id}" value="${parseFloat(p.costo).toFixed(2)}" min="0.01" step="0.01" oninput="activarEdicionFila(${p.id})"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all text-right font-mono text-amber-500/90 text-xs">
                    </td>
                    
                    <td class="px-4 py-2.5">
                        <input type="number" id="edit-precio-${p.id}" value="${parseFloat(p.precio).toFixed(2)}" min="0.01" step="0.01" oninput="activarEdicionFila(${p.id})"
                               class="w-full bg-transparent border border-transparent rounded-lg px-2 py-1 focus:bg-gray-950 focus:border-gray-800 focus:outline-none transition-all text-right font-mono text-sky-400 text-xs">
                    </td>
                    
                    <td class="px-4 py-2.5 text-center">
                        <div id="wrapper-acciones-${p.id}" class="flex items-center justify-center gap-1 opacity-20 group-hover:opacity-100 transition-opacity">
                            <span class="text-[10px] font-mono text-gray-600 py-1">Sin cambios</span>
                        </div>
                    </td>
                `;
                tablaBody.appendChild(tr);
            });
        }

        // ⚡ INTERACTIVIDAD: Activar botones de confirmación solo en la fila modificada
        window.activarEdicionFila = (id) => {
            const contenedorAcciones = document.getElementById(`wrapper-acciones-${id}`);
            const fila = document.getElementById(`fila-prod-${id}`);
            
            if (contenedorAcciones && !contenedorAcciones.querySelector('.btn-guardar-save')) {
                fila.classList.add('bg-gray-900/60');
                contenedorAcciones.innerHTML = `
                    <button onclick="guardarCambiosServidor(${id})" class="btn-guardar-save p-1.5 rounded-md text-emerald-400 hover:text-emerald-300 bg-emerald-950/40 hover:bg-emerald-950/80 border border-emerald-500/20 cursor-pointer transition-all shadow-sm" title="Guardar cambios">
                        💾
                    </button>
                    <button onclick="cancelarEdicionFila(${id})" class="p-1.5 rounded-md text-rose-400 hover:text-rose-300 bg-rose-950/40 hover:bg-rose-950/80 border border-rose-500/20 cursor-pointer transition-all shadow-sm" title="Cancelar / Revertir">
                        ❌
                    </button>
                `;
                contenedorAcciones.classList.remove('opacity-20');
                contenedorAcciones.classList.add('opacity-100');
            }
        };

        // ❌ CANCELAR: Revertir los campos de la fila al estado original
        window.cancelarEdicionFila = (id) => {
            const original = productosLocales.find(p => p.id === id);
            if (!original) return;

            document.getElementById(`edit-codigo-${id}`).value = original.codigo_barras || '';
            document.getElementById(`edit-nombre-${id}`).value = original.nombre;
            document.getElementById(`edit-categoria-${id}`).value = original.categoria;
            document.getElementById(`edit-descripcion-${id}`).value = original.descripcion || '';
            document.getElementById(`edit-stock-${id}`).value = original.stock;
            document.getElementById(`edit-costo-${id}`).value = parseFloat(original.costo).toFixed(2);
            document.getElementById(`edit-precio-${id}`).value = parseFloat(original.precio).toFixed(2);

            const contenedorAcciones = document.getElementById(`wrapper-acciones-${id}`);
            const fila = document.getElementById(`fila-prod-${id}`);
            
            fila.classList.remove('bg-gray-900/60');
            contenedorAcciones.innerHTML = `<span class="text-[10px] font-mono text-gray-600 py-1">Sin cambios</span>`;
            contenedorAcciones.classList.add('opacity-20');
            contenedorAcciones.classList.remove('opacity-100');
        };

        // 💾 PERSISTENCIA: Mandar datos al Backend y capturar excepciones de Pydantic/FastAPI
        window.guardarCambiosServidor = async (id) => {
            const btnSave = document.querySelector(`#wrapper-acciones-${id} .btn-guardar-save`);
            if (btnSave) btnSave.disabled = true;

            // Recolectar datos en caliente de los inputs
            const rawCodigo = document.getElementById(`edit-codigo-${id}`).value.trim();
            const rawNombre = document.getElementById(`edit-nombre-${id}`).value.trim();
            const rawCat = document.getElementById(`edit-categoria-${id}`).value;
            const rawDesc = document.getElementById(`edit-descripcion-${id}`).value.trim();
            const rawStock = document.getElementById(`edit-stock-${id}`).value;
            const rawCosto = document.getElementById(`edit-costo-${id}`).value;
            const rawPrecio = document.getElementById(`edit-precio-${id}`).value;

            // Estructurar DTO respetando tu ProductoUpdate
            const payload = {
                nombre: rawNombre,
                codigo_barras: rawCodigo === "" ? null : rawCodigo,
                descripcion: rawDesc === "" ? null : rawDesc,
                categoria: normalizarCategoria(rawCat),
                stock: parseInt(rawStock) || 0,
                costo: parseFloat(rawCosto) || 0.0,
                precio: parseFloat(rawPrecio) || 0.0
            };

            try {
                // Petición directa a tu controlador usando PUT
                const respuesta = await fetch(`/productos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (respuesta.ok) {
                    const productoActualizado = await respuesta.json();
                    
                    // Actualizar base de datos local en memoria
                    const index = productosLocales.findIndex(p => p.id === id);
                    if (index !== -1) productosLocales[index] = productoActualizado;

                    emitirNotificacionGlobal(`✨ Producto ID ${id} modificado exitosamente.`, "exito");
                    
                    // Reestablecer la fila visualmente
                    const contenedorAcciones = document.getElementById(`wrapper-acciones-${id}`);
                    const fila = document.getElementById(`fila-prod-${id}`);
                    fila.classList.remove('bg-gray-900/60');
                    contenedorAcciones.innerHTML = `<span class="text-[10px] font-mono text-emerald-500 font-bold bg-emerald-950/30 px-1.5 py-0.5 rounded">✓ Guardado</span>`;
                    
                    setTimeout(() => {
                        procesarYRenderizar();
                    }, 800);

                } else {
                    // Manejo avanzado de errores del backend (reglas de negocio de FastAPI)
                    const errorJson = await respuesta.json().catch(() => ({}));
                    let mensajeError = errorJson.detail;
                    if (Array.isArray(errorJson.detail)) {
                        mensajeError = errorJson.detail.map(err => err.msg).join(" | ");
                    }
                    emitirNotificacionGlobal(`❌ Error: ${mensajeError || "No se pudieron salvar los datos."}`, "error");
                    if (btnSave) btnSave.disabled = false;
                }
            } catch (error) {
                emitirNotificacionGlobal(`⚠️ Error de red al intentar impactar la base de datos: ${error.message}`, "error");
                if (btnSave) btnSave.disabled = false;
            }
        };

        // ⚡ LISTENERS DE EVENTOS DE CONTROL (Inputs reactivos)
        filtroNombre.addEventListener('input', () => { paginaActual = 1; procesarYRenderizar(); });
        filtroCategoria.addEventListener('change', () => { paginaActual = 1; procesarYRenderizar(); });
        filtroOrden.addEventListener('change', () => { paginaActual = 1; procesarYRenderizar(); });
        
        btnLimpiar.addEventListener('click', () => {
            filtroNombre.value = "";
            filtroCategoria.value = "";
            filtroOrden.value = "nombre_asc";
            paginaActual = 1;
            procesarYRenderizar();
            emitirNotificacionGlobal("🧹 Filtros de catálogo reseteados", "exito");
        });

        btnAnt.addEventListener('click', () => { if (paginaActual > 1) { paginaActual--; procesarYRenderizar(); } });
        btnSig.addEventListener('click', () => { paginaActual++; procesarYRenderizar(); });

        // Disparar carga inicial
        inicializarModulo();
    })();
</script>
